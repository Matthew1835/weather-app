<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="panel">
        <h1>Weather for Today</h1>

        <form action="" id="location-form">
            <input type="text" id="location-input" placeholder="Enter a city..." autocomplete="off">
            <button type="submit">Search</button>
        </form>

        <p id="error" role="alert"></p>
        <p id="loading" hidden>Fetching forecast...</p>

        <section id="result" hidden>
            <div class="reading">
                <span class="icon" aria-hidden="true"></span>
                <span class="temp"></span>
            </div>
            <p class="description"></p>
            <p class="location"></p>

            <button type="button" id="unit-toggle">Show °F</button>

            <dl class="details">
                <div>
                    <dt>Feels like</dt>
                    <dd class="feels-like"></dd>
                </div>
                <div>
                    <dt>Humidity</dt>
                    <dd class="humidity"></dd>
                </div>
                <div>
                    <dt>Wind</dt>
                    <dd class="wind"></dd>
                </div>
            </dl>

            <img id="weather-gif" alt="" hidden>
        </section>
    </main>

    <script src="./script.js" defer></script>
</body>
</html>
